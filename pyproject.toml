[project]
name = "shader"
version = "0.1.0"
description = "Builds a Minecraft resource pack of shaders from the game's own shaders and a set of effects."
requires-python = ">=3.11"
dependencies = ["deal", "pillow"]

[dependency-groups]
dev = ["pytest", "hypothesis", "zigdag"]

[tool.uv.sources]
zigdag = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
