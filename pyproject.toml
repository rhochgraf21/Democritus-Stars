[project]
name = "democritus-stars"
version = "0.1.0"
description = "A fast and realistic night sky resource pack for vanilla Minecraft."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
dependencies = ["deal", "pillow"]

[project.scripts]
democritus = "democritus.command:main"

[project.urls]
Repository = "https://github.com/rhochgraf21/Democritus-Stars"

[dependency-groups]
dev = ["pytest", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/democritus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
