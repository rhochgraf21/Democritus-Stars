democritus.effects.stars.catalogue:
  - shader.effects.stars.catalogue
  - shader.effects.stars.catalogue.CatalogueStar
democritus.effects.stars.figures:
  - shader.effects.stars.figures
  - shader.effects.stars.figures.FigureLine
  - shader.effects.stars.figures.SkyPlace
democritus.effects.stars.galaxy:
  - shader.effects.stars.galaxy
  - shader.effects.stars.galaxy.GalacticDirection
  - shader.effects.stars.galaxy.Glow
  - shader.effects.stars.galaxy.Satellite
  - shader.effects.stars.galaxy.StarSheet
