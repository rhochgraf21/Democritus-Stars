# The types that pass between the parts belong to the part that describes them: each is recorded here so
# that the checks know them as structures of the design, and hold every other part to using them as given.
democritus: [democritus]
democritus.vanilla:
  - democritus.vanilla
  - democritus.vanilla.Game
  - democritus.vanilla.ResourceFormat
  - democritus.vanilla.ShaderFile
  - democritus.vanilla.Texture
  - democritus.vanilla.Pixel
democritus.effects:
  - democritus.effects
  - democritus.effects.Effect
  - democritus.effects.Attachment
  - democritus.effects.Position
  - democritus.effects.Landmark
democritus.markers:
  - democritus.markers
  - democritus.markers.Surface
  - democritus.markers.AlphaMark
  - democritus.markers.Signature
  - democritus.markers.Probe
democritus.validator: [democritus.validator, democritus.validator.CompileFailure]
democritus.command: [democritus.command]
democritus.composer: [democritus.composer]
democritus.pack: [democritus.pack]
democritus.effects.stars.catalogue:
